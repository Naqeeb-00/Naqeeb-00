<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#0E2A19" stroke-width="1"/>
  </pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00FF41" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#00FF41" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#00FF41" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00FF41" stop-opacity="0"/>
    <stop offset="1" stop-color="#00FF41" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="fadeR" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#050807"/><stop offset="0.2" stop-color="#050807" stop-opacity="0"/>
    <stop offset="0.8" stop-color="#050807" stop-opacity="0"/><stop offset="1" stop-color="#050807"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  <clipPath id="hexclip"><rect x="1030" y="44" width="160" height="236"/></clipPath>
  <clipPath id="typeclip"><rect x="330" y="186" height="30" width="0">
    <animate attributeName="width" values="0;620;620;0" keyTimes="0;0.35;0.9;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<style>
  .m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
  @keyframes j1{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(-5px,2px)}93%{transform:translate(4px,-2px)}95%{transform:translate(-2px,1px)}97%{transform:translate(3px,0)}}
  @keyframes j2{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(5px,-1px)}93%{transform:translate(-4px,2px)}95%{transform:translate(2px,-1px)}97%{transform:translate(-3px,0)}}
  @keyframes blink{50%{opacity:0}}
  .r{animation:j1 3.2s infinite} .c{animation:j2 3.2s infinite}
  .cur{animation:blink 1s step-end infinite}
  .pulse{animation:blink 1.6s ease-in-out infinite}
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="320" fill="#050807"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.7"/>

